name: reviewability

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  reviewability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: Siddhant-K-code/agent-trace@v0.108.0
        with:
          run-eval: "false"
          review: "true"
          review-commits: origin/${{ github.base_ref }}..HEAD
          cognitive-debt: report
          post-pr-comment: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
